<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoGram Messenger</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e7ebf0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: #f4f4f5;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        @media (min-width: 451px) {
            .chat-container {
                height: 90vh;
                border-radius: 12px;
                overflow: hidden;
            }
        }

        .chat-header {
            background: #2481cc;
            color: white;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .chat-header h2 {
            font-size: 18px;
            font-weight: 500;
        }

        .chat-header span {
            font-size: 13px;
            opacity: 0.8;
            margin-top: 2px;
        }

        .messages-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-image: url('https://telegram.org');
            background-size: cover;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 15px;
            position: relative;
            word-break: break-word;
            line-height: 1.4;
        }

        .message.incoming {
            background: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #000;
        }

        .message.outgoing {
            background: #eeffde;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #000;
        }

        .message .username {
            font-size: 12px;
            font-weight: bold;
            color: #2481cc;
            margin-bottom: 2px;
            display: block;
        }

        .input-area {
            background: white;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #dfe1e5;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
        }

        .input-area button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background: #1c71b3;
        }
    </style>
    <!-- Подключаем библиотеку Supabase через CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2 id="chat-title">NeoGram Chat</h2>
            <span id="user-status">Загрузка...</span>
        </div>
        
        <div class="messages-box" id="messagesBox"></div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Написать сообщение..." autocomplete="off">
            <button id="sendBtn">➔</button>
        </div>
    </div>

    <script>
        // НАСТРОЙКИ ВАШЕГО СЕРВЕРА SUPABASE
        const SUPABASE_URL = "https://kbhjuliwskwfuboogcxr.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiaGp1bGl3c2t3ZnVib29nY3hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDA2NjEsImV4cCI6MjEwMjYxNjY2MX0.icHSaaVztXBPom3viJQp0w38AlqO1uYZ2ok2nWPYmoQ";

        // Инициализация клиента Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Работа с никнеймом
        let myUsername = localStorage.getItem('chat_username');
        if (!myUsername) {
            myUsername = prompt("Добро пожаловать в NeoGram! Введите ваш никнейм:");
            if (!myUsername || myUsername.trim() === "") {
                myUsername = "User_" + Math.floor(Math.random() * 9000 + 1000);
            } else {
                myUsername = myUsername.trim();
            }
            localStorage.setItem('chat_username', myUsername);
        }
        document.getElementById('user-status').innerText = `@${myUsername}`;

        const messagesBox = document.getElementById('messagesBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // Функция отрисовки одного сообщения на экране
        function appendMessage(msg) {
            // Проверяем, нет ли уже такого сообщения на экране (по id)
            if (document.getElementById(`msg-${msg.id}`)) return;

            const msgDiv = document.createElement('div');
            msgDiv.id = `msg-${msg.id}`;
            msgDiv.classList.add('message');
            
            if (msg.username === myUsername) {
                msgDiv.classList.add('outgoing');
            } else {
                msgDiv.classList.add('incoming');
                
                const nameSpan = document.createElement('span');
                nameSpan.classList.add('username');
                nameSpan.innerText = `@${msg.username}`;
                msgDiv.appendChild(nameSpan);
            }

            const textSpan = document.createElement('span');
            textSpan.innerText = msg.text;
            msgDiv.appendChild(textSpan);

            messagesBox.appendChild(msgDiv);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        // 1. Загрузка старых сообщений при открытии сайта
        async function loadExistingMessages() {
            const { data, error } = await supabaseClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (data) {
                data.forEach(msg => appendMessage(msg));
            }
        }
        loadExistingMessages();

        // 2. Отправка нового сообщения в базу данных
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            messageInput.value = "";

            const { error } = await supabaseClient
                .from('messages')
                .insert([{ username: myUsername, text: text }]);
                
            if (error) console.error("Ошибка отправки:", error);
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 3. Подписка на новые сообщения в реальном времени (Realtime)
        supabaseClient
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                appendMessage(payload.new);
            })
            .subscribe();
    </script>
</body>
</html>
